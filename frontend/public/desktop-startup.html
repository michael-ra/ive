<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IVE</title>
<style>
:root{font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#ebedf3;background:#14161b;color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:580px;padding:48px}h1{font-size:44px;letter-spacing:-2px;margin:0 0 28px}h1 span{color:#6f89ff}h2{font-size:22px;font-weight:550}p{color:#aeb6c7}#detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}small{color:#7f899c}.pulse{width:28px;height:3px;background:#6f89ff;animation:fade 1.2s ease-in-out infinite;margin-bottom:22px}@keyframes fade{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body><main><h1>IVE<span>.</span></h1><div class="pulse" id="progress"></div><h2 id="status">Starting your workspace …</h2><p id="detail">IVE is starting its local service. Your projects stay on your Mac.</p><small id="hint">The first start can take a moment.</small></main>
<script>window.iveDesktopStatus=(message,detail)=>{document.getElementById('status').textContent=message;document.getElementById('detail').textContent=detail;document.getElementById('progress').hidden=true;document.getElementById('hint').textContent='Quit IVE with ⌘Q and open it again.'}</script></body></html>
